
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sobzee.android'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sobzee.android'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        tasks.register('checkManifestXml') {
    doLast {
        def f = file('src/main/AndroidManifest.xml')
        println "Checking manifest: ${f.absolutePath}"
        println "File exists: ${f.exists()}"
        println "First 200 characters: " + f.getText('UTF-8').take(200)
        new XmlParser().parse(f)
        println "Manifest XML is valid."
          }
        }
    }

